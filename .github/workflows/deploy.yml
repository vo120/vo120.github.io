name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one live deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-portfolio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-portfolio/package-lock.json

      - run: npm ci

      # CI=false so build warnings don't fail the build.
      # `npm run build` also runs the postbuild obfuscation step.
      - run: npm run build
        env:
          CI: false

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (with "GitHub Actions" as the source) so there's
          # no manual Settings step required.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: my-portfolio/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
